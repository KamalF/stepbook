[package]
name = "stepbook"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Run the bash blocks of a Markdown runbook one at a time, in a terminal UI"
repository = "https://github.com/KamalF/stepbook"
keywords = ["runbook", "markdown", "tui", "bash", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
crossbeam-channel = "0.5.17"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
rustix = { version = "1.1.6", features = ["event", "pty", "termios", "process"] }
signal-hook = "0.3.18"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
vt100 = { version = "0.18.1", default-features = false }
vte = { version = "0.15.0", default-features = false }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"
