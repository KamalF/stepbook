# Copy only the files that git tracks or would track: the sandbox of
# Claude Code masks some untracked files, such as .claude/, which a copy
# cannot read.
gitignore = true

# Mutants that no test should catch. A run then shows only new gaps.
exclude_re = [
    # The flags of inotify and of open are distinct bits: ^ gives the same
    # value as |.
    "watch.rs:\\d+:\\d+: replace \\| with \\^ in spawn",
    "log.rs:\\d+:\\d+: replace \\| with \\^ in open",
    "main.rs:\\d+:\\d+: replace \\| with \\^ in read_runbook",
    # The open flags of read_runbook matter only if the file changes
    # between its stat and its open, which no test can time: the stat
    # refuses a FIFO first.
    "main.rs:\\d+:\\d+: replace \\| with & in read_runbook",
    # A reload of the same text skips only the parse: apply then finds no
    # change either.
    "replace match guard text == self.text with false in App::reload",
    # The tests take the bound of the held text from the constant; spec
    # 12.2 gives its value.
    "log.rs:\\d+:\\d+: replace \\* with \\+$",
    # A selected block that ends at the top of the screen is under an
    # output above the top too, which keeps the view in place either way.
    "view.rs:\\d+:75: replace > with >= in View::scroll_after",
    # The event loop draws each frame and applies the action of each key:
    # the check in tmux covers it, and main::action has its own tests.
    "replace event_loop -> ",
    "in event_loop$",
    # The option flags are distinct bits: ^ gives the same value as |.
    "replace \\| with \\^ in options",
    # If the lines fill the view exactly, both branches give the same
    # scroll. If top equals scroll, the result is scroll either way.
    "view.rs:\\d+:24: replace > with >= in scroll_to",
    "view.rs:\\d+:19: replace < with <= in scroll_to",
    # If the block ends at the bottom of the view, scroll and
    # block.end - height are the same.
    "view.rs:\\d+:25: replace > with >= in scroll_to",
    # Only the parity of the list count picks the bullet, and += keeps it.
    "replace -= with \\+= in Builder::end",
    # The terminal setup and restore: the check in tmux covers them.
    "replace restore_terminal with \\(\\)",
    # Spans of one style look the same on screen: the merge only saves
    # allocations.
    "replace match guard .* with false in (push_styled|join_styles)",
    # The page keys scroll by 1 or -1 page, where / gives the sign of *,
    # and a block equal to the selection keeps the same selection.
    "view.rs:\\d+:60: replace \\* with / in View::scroll_pages",
    "view.rs:\\d+:68: replace < with <= in View::scroll_pages",
    # With a room equal to the columns, the shrink also ends at width 1.
    "replace < with <= in table",
    # One more pending space shows only before a word of width 0, which the
    # buffer drops: the row is spaces either way.
    "replace < with <= in wrap",
    # The end of the runs when stepbook ends: a test would end the runs of
    # the other tests, all children of the test process. The check in tmux
    # covers it.
    "replace end_runs with \\(\\)",
    "in end_runs$",
    # These two widen the processes to signal to each process of the user:
    # SIGKILL would end cargo-mutants, and outside a sandbox the desktop
    # session too. On 2026-11-11, in the sandbox, they killed two runs.
    "run.rs:\\d+:68: replace && with \\|\\| in end_sessions",
    "replace == with != in session_processes",
    # The thread that reads the keys: the check in tmux covers it.
    "replace read_terminal with \\(\\)",
    "in read_terminal$",
    # The size of a read of the PTY: a smaller buffer gives the same output.
    "run.rs:\\d+:\\d+: replace \\* with \\+$",
    # The flags of the PTY are distinct bits: ^ gives the same value as |.
    "replace \\| with \\^ in open_pty",
    # A read of the PTY never fails with EINTR: signal-hook and crossterm
    # install their handlers with SA_RESTART.
    "replace match guard e.kind\\(\\) == std::io::ErrorKind::Interrupted with false in read_run",
    # The flags of waitid, and the halves of a size, are distinct bits: ^
    # gives the same value as |.
    "replace \\| with \\^ in read_run",
    "replace \\| with \\^ in Shared::resize",
    # Two instants are never equal: <= gives the same wait as <.
    "replace < with <= in end_sessions",
    # With as many rows as asked, the scrollback adds none.
    "term.rs:\\d+:\\d+: replace < with <= in last_rows$",
]
